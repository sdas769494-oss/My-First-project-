<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WhatsApp-like Chat List (Demo)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --primary: #00a884;
        --muted: #6b6b6b;
        --light: #f7f9f8;
        --chip-bg: #e9f7f2;
        --accent: #25d366;
        --card-radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, Arial;
        background: var(--bg);
        color: #111;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 18px;
        display: flex;
        justify-content: center;
      }

      /* container simulating phone screen */
      .phone {
        width: 380px;
        max-width: 100%;
        background: white;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        border: 1px solid #eee;
      }

      /* header */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .brand h1 {
        margin: 0;
        color: var(--primary);
        font-size: 20px;
        font-weight: 700;
      }
      .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      /* tabs */
      .tabs {
        display: flex;
        gap: 10px;
        padding: 6px 14px 14px 14px;
      }
      .tab {
        background: #f2f4f3;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        color: #6b6b6b;
        font-size: 14px;
      }
      .tab.active {
        background: linear-gradient(180deg, #e8fff6, #e1fff1);
        color: #0b8b6b;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02) inset;
      }

      /* list */
      .list {
        padding: 8px 6px 90px 6px; /* room for FAB */
      }
      .item {
        display: flex;
        gap: 12px;
        padding: 12px 12px;
        align-items: center;
        border-radius: 12px;
      }
      .item + .item {
        margin-top: 6px;
      }

      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        flex: 0 0 52px;
        background: #ddd;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #fff;
        font-size: 20px;
      }

      .meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .name {
        font-weight: 700;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .time {
        font-size: 13px;
        color: var(--muted);
        min-width: 35px;
        text-align: right;
      }
      .preview {
        font-size: 14px;
        color: #666;
        margin-top: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .badge {
        background: var(--accent);
        color: white;
        min-width: 28px;
        padding: 4px 8px;
        height: 28px;
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
      }

      .pinned {
        width: 18px;
        height: 18px;
        opacity: 0.6;
      }

      /* small icon for image preview */
      .icon-img {
        width: 16px;
        height: 12px;
        display: inline-block;
        background: #ddd;
        border-radius: 2px;
      }

      /* floating action button */
      .fab {
        position: absolute;
        right: 20px;
        bottom: 24px;
        width: 64px;
        height: 64px;
        background: var(--accent);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        cursor: pointer;
        border: 4px solid rgba(255, 255, 255, 0.6);
      }

      /* small helper styles */
      .muted {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .typing {
        color: #10a37f;
        font-weight: 600;
      }

      /* responsive smaller devices */
      @media (max-width: 420px) {
        .phone {
          width: 100%;
          margin: 0 6px;
        }
        .avatar {
          width: 48px;
          height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone" role="application" aria-label="Chat list demo">
      <header>
        <div class="brand" aria-hidden="false">
          <!-- small camera icon -->

      </header>

      <nav class="tabs" role="tablist" aria-label="Chats tabs">
        <div class="tab active" role="tab" aria-selected="true">All</div>
        <div class="tab" role="tab">New Contact</div>
        <div class="tab" role="tab">Logout</div>
      </nav>

      <main class="list" role="main">
        <!-- Pinned group -->
        <article class="item" aria-label="IRA - pinned">
          <div

            style="background: linear-gradient(135deg, #67d3a1, #34b08a)"

            😎

          <div class="meta">
            <div class="row">
              <div class="name">IRA</div>

            </div>
            <div class="preview muted">
              <span class="muted">SUJIT: </span>
              <span>👀</span>
            </div>
          </div>
          <!-- pinned icon -->
          <svg class="pinned" viewBox="0 0 24 24" fill="none" aria-hidden>
            <path
              d="M12 3v10"
              stroke="#888"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M8 21h8"
              stroke="#888"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9 7h6"
              stroke="#888"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

        </article>

        <!-- A conversation that shows typing and unread badge -->
        <article class="item" aria-label="Andrius Schneider">

          <div

              align-items: center;

            <div class="badge" aria-hidden>2</div>
          </div>

        <!-- photo preview -->
        <article class="item" aria-label="Anna Payet">
          <div
            class="avatar"
            style="
              background-image: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?fit=crop&w=200&q=60');

          <div class="meta">
            <div class="row">
              <div class="name">SUJIT</div>
              <div class="time muted">9:37</div>
            </div>
            <div class="preview">
              <span class="icon-img" aria-hidden></span><span>TYPE ANY </span>
            </div>

        <!-- family group -->
        <article class="item" aria-label="Family">
          <div

            "
          ></div>

            <div class="row">
              <div class="name">IRA</div>
              <div class="time muted">23/09/2025</div>
            </div>
            <div class="preview muted"><span>TESTING LINGO </span></div>
          </div>
        </article>

        <!-- Maria -->
        <article class="item" aria-label="Maria">
          <div
            class="avatar"
            style="
              background-image: url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?fit=crop&w=200&q=60');
              background-size: cover;
            "

          <div class="meta">
            <div class="row">
              <div class="name">IRA</div>
              <div class="time muted">23/09/2025</div>

            <div class="preview">
              <span>GOOD MORNING...</span>
            </div>

        <!-- lunch club -->
        <article class="item" aria-label="gorup">

              background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?fit=crop&w=200&q=60');

            "

          <div class="meta">
            <div class="row">
              <div class="name">IRA</div>
              <div class="time muted">23/09/2025</div>
            </div>

            </div>
          </div>
        </article>
      </main>

      <!-- floating new chat button -->
      <div class="fab" title="New chat" role="button" aria-label="New chat">
        <!-- plus icon -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden>
          <path
            d="M12 5v14"
            stroke="white"
            stroke-width="2.2"
            stroke-linecap="round"
          />
          <path
            d="M5 12h14"
            stroke="white"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

      (function () {

        if (!el) return;
        const states = [
          "typing.",
          "typing..",
