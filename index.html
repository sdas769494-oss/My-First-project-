<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Diwali — Debanjana</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b0034, #0a001a);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      perspective: 1000px;
    }
    h1 {
      font-size: 60px;
      font-weight: 900;
      color: transparent;
      background: linear-gradient(45deg, #ffb703, #ff4d6d, #ffd700);
      -webkit-background-clip: text;
      animation: shine 3s linear infinite;
      text-shadow: 0 0 30px rgba(255,255,255,0.3);
      transform-style: preserve-3d;
    }
    @keyframes shine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .btn {
      margin-top: 40px;
      background: linear-gradient(90deg, #ff4d6d, #ffb703);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255,180,0,0.5);
    }
    .fireworks {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
    }
    #specialMessage {
      opacity: 0;
      transition: opacity 1s ease-in-out;
      font-size: 24px;
      margin-top: 20px;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <canvas class="fireworks"></canvas>
  <div class="container">
    <h1 id="name">Happy Diwali Debanjana ✨</h1>
    <button class="btn" onclick="showSpecial()">Click for Surprise 💫</button>
    <div id="specialMessage">May the diyas of Diwali brighten your life and bring you success.” Debanjana! 🪔✨</div>
  </div>
  <script>
    const fireworksCanvas = document.querySelector('.fireworks');
    const ctx = fireworksCanvas.getContext('2d');
    let W, H;
    function resize(){ W = fireworksCanvas.width = innerWidth; H = fireworksCanvas.height = innerHeight; }
    window.addEventListener('resize', resize); resize();const particles = [];
function Firework(x, y, color){
  for(let i = 0; i < 50; i++){
    particles.push({
      x, y,
      dx: Math.random()*6-3,
      dy: Math.random()*6-3,
      life: 100,
      color
    });
  }
}
function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,W,H);
  particles.forEach((p, i) => {
    p.x += p.dx;
    p.y += p.dy;
    p.dy += 0.02;
    p.life--;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
    ctx.fill();
    if(p.life <= 0) particles.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

function showSpecial(){
  Firework(W/2, H/2, 'hsl('+Math.random()*360+',100%,60%)');
  Firework(W/3, H/3, 'hsl('+Math.random()*360+',100%,60%)');
  Firework(W/1.5, H/4, 'hsl('+Math.random()*360+',100%,60%)');
  document.getElementById('specialMessage').style.opacity = 1;
}

  </script>
</body>
</html>
