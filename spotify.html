<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spotify जैसा - Demo</title>
  <style>
    :root{
      --green:#1DB954;
      --dark:#121212;
      --light:#181818;
      --text:#fff;
      --muted:#b3b3b3;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Roboto,Arial;background:var(--dark);color:var(--text);overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--light);position:sticky;top:0;z-index:10}
    header .logo{font-weight:700;font-size:20px;color:var(--green)}
    header input{width:300px;padding:8px 10px;border-radius:20px;border:none;outline:none;background:#282828;color:#fff}

    .container{display:flex;height:calc(100vh - 60px)}
    nav.sidebar{width:220px;background:var(--light);padding:20px;display:flex;flex-direction:column;gap:12px}
    nav.sidebar a{color:var(--muted);text-decoration:none;padding:8px 0;font-size:15px;transition:.2s}
    nav.sidebar a:hover{color:#fff}

    main{flex:1;background:#181818;overflow-y:auto;padding:24px}
    h2{margin-top:0;font-size:20px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
    .card{background:#282828;padding:12px;border-radius:8px;cursor:pointer;transition:.2s}
    .card:hover{background:#333}
    .thumb{width:100%;height:160px;border-radius:6px;object-fit:cover;margin-bottom:10px}
    .title{font-size:15px;margin:0 0 4px;color:#fff}
    .artist{font-size:13px;color:var(--muted);margin:0}

    footer.player{position:fixed;bottom:0;left:0;right:0;background:#181818;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid #333}
    .song-info{display:flex;align-items:center;gap:10px}
    .song-info img{width:50px;height:50px;border-radius:4px}
    .controls{display:flex;align-items:center;gap:16px;font-size:20px}
    .progress{flex:1;margin:0 20px;height:4px;background:#333;border-radius:2px;position:relative}
    .progress::after{content:'';position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--green);border-radius:2px}

    @media(max-width:800px){
      nav.sidebar{display:none}
      header input{width:160px}
      .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SpotClone</div>
    <input type="text" id="search" placeholder="Search songs or artists...">
    <div>Profile</div>
  </header>

  <div class="container">
    <nav class="sidebar">
      <a href="#">Home</a>
      <a href="#">Search</a>
      <a href="#">Your Library</a>
      <hr style="border:1px solid #333;width:100%">
      <a href="#">Liked Songs</a>
      <a href="#">Create Playlist</a>
    </nav>

    <main>
      <h2>Trending Now</h2>
      <div class="grid" id="songsGrid">
        <div class="card" data-song="Shape of You" data-artist="Ed Sheeran" data-img="https://via.placeholder.com/300x300?text=Shape+of+You">
          <img class="thumb" src="https://via.placeholder.com/300x300?text=Shape+of+You" alt="">
          <p class="title">Shape of You</p>
          <p class="artist">Ed Sheeran</p>
        </div>
        <div class="card" data-song="Blinding Lights" data-artist="The Weeknd" data-img="https://via.placeholder.com/300x300?text=Blinding+Lights">
          <img class="thumb" src="https://via.placeholder.com/300x300?text=Blinding+Lights" alt="">
          <p class="title">Blinding Lights</p>
          <p class="artist">The Weeknd</p>
        </div>
        <div class="card" data-song="Levitating" data-artist="Dua Lipa" data-img="https://via.placeholder.com/300x300?text=Levitating">
          <img class="thumb" src="https://via.placeholder.com/300x300?text=Levitating" alt="">
          <p class="title">Levitating</p>
          <p class="artist">Dua Lipa</p>
        </div>
        <div class="card" data-song="Perfect" data-artist="Ed Sheeran" data-img="https://via.placeholder.com/300x300?text=Perfect">
          <img class="thumb" src="https://via.placeholder.com/300x300?text=Perfect" alt="">
          <p class="title">Perfect</p>
          <p class="artist">Ed Sheeran</p>
        </div>
      </div>
    </main>
  </div>

  <footer class="player">
    <div class="song-info">
      <img id="currentImg" src="https://via.placeholder.com/300x300?text=No+Song" alt="">
      <div>
        <div id="currentSong">No song playing</div>
        <small id="currentArtist" style="color:var(--muted)">-</small>
      </div>
    </div>
    <div class="controls">
      <span>⏮</span>
      <span>▶️</span>
      <span>⏭</span>
    </div>
    <div class="progress"></div>
  </footer>

  <script>
    const cards=document.querySelectorAll('.card');
    const currentSong=document.getElementById('currentSong');
    const currentArtist=document.getElementById('currentArtist');
    const currentImg=document.getElementById('currentImg');

    cards.forEach(card=>{
      card.addEventListener('click',()=>{
        currentSong.textContent=card.dataset.song;
        currentArtist.textContent=card.dataset.artist;
        currentImg.src=card.dataset.img;
      });
    });

    document.getElementById('search').addEventListener('input',e=>{
      const q=e.target.value.toLowerCase();
      cards.forEach(c=>{
        const name=c.dataset.song.toLowerCase();
        const artist=c.dataset.artist.toLowerCase();
        c.style.display=(name.includes(q)||artist.includes(q))?'':'none';
      });
    });
  </script>
</body>
</html>
