<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Debanjana — Sweet & Lovely</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg1: #fff1f8;
        --bg2: #fff6ea;
        --accent: #ff6fa3;
        --accent-2: #ffd166;
        --soft: rgba(255, 111, 163, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Montserrat, system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial;
      }
      body {
        background: radial-gradient(
          circle at 10% 10%,
          var(--bg1),
          var(--bg2) 60%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .card {
        width: min(920px, 96%);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.65),
          rgba(255, 255, 255, 0.35)
        );
        border-radius: 20px;
        padding: 48px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(6px);
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(36px);
        opacity: 0.9;
        transform: translate3d(0, 0, 0);
        animation: drift 12s ease-in-out infinite alternate;
      }
      .blob.b1 {
        width: 400px;
        height: 400px;
        right: -120px;
        top: -80px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        opacity: 0.12;
      }
      .blob.b2 {
        width: 260px;
        height: 260px;
        left: -90px;
        bottom: -70px;
        background: linear-gradient(135deg, var(--accent-2), #ffdbe6);
        opacity: 0.14;
        animation-duration: 10s;
      }

      @keyframes drift {
        to {
          transform: translateY(-28px) translateX(18px) rotate(6deg);
        }
      }

      .content {
        display: flex;
        gap: 28px;
        align-items: center;
        position: relative;
        z-index: 2;
      }

      .left {
        flex: 0 0 240px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .heart-wrap {
        width: 180px;
        height: 180px;
        display: grid;
        place-items: center;
        position: relative;
        transform: scale(1);
        animation: pop 1.8s ease-out infinite;
      }

      @keyframes pop {
        0% {
          transform: scale(0.96);
        }
        60% {
          transform: scale(1.06);
        }
        100% {
          transform: scale(1);
        }
      }

      .heart {
        width: 90px;
        height: 90px;
        position: relative;
      }
      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 90px;
        height: 90px;
        background: linear-gradient(135deg, var(--accent), #ffcedb);
        border-radius: 50%;
        top: 0;
        left: 0;
        transform-origin: center;
      }
      .heart::before {
        transform: translateX(-28px) rotate(-45deg);
      }
      .heart::after {
        transform: translateY(-28px) rotate(45deg);
      }
      .heart > .core {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 70px;
        height: 70px;
        background: linear-gradient(180deg, #fff, rgba(255, 255, 255, 0.7));
        border-radius: 40px;
        box-shadow: 0 8px 20px rgba(255, 111, 163, 0.16) inset;
      }

      .right {
        flex: 1;
      }
      h1 {
        margin: 0;
        font-family: "Great Vibes", cursive;
        font-size: 84px;
        line-height: 0.86;
        letter-spacing: 0.6px;
        color: #ff2f76;
        text-shadow: 0 8px 30px rgba(255, 111, 163, 0.12),
          0 1px 0 rgba(255, 255, 255, 0.6) inset;
        transform: translateY(-4px);
        display: inline-block;
        padding: 6px 12px;
        border-radius: 14px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.15),
          rgba(255, 255, 255, 0.02)
        );
        animation: sparkle 3.6s linear infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: initial;
      }

      @keyframes sparkle {
        0% {
          filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
        }
        50% {
          filter: drop-shadow(0 12px 36px rgba(255, 111, 163, 0.15));
        }
        100% {
          filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
        }
      }

      .subtitle {
        font-size: 16px;
        margin-top: 8px;
        color: #6b6b6b;
      }

      .wish-box {
        margin-top: 16px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.8),
          rgba(255, 255, 255, 0.65)
        );
        padding: 14px 18px;
        border-radius: 16px;
        font-size: 15px;
        color: #444;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        font-style: italic;
      }

      .tags {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .tag {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.78)
        );
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 600;
        box-shadow: 0 6px 18px rgba(18, 18, 18, 0.04);
      }

      .sparkles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .sparkle {
        position: absolute;
        width: 14px;
        height: 14px;
        background: linear-gradient(135deg, var(--accent), #ffdbe6);
        transform: rotate(45deg);
        border-radius: 3px;
        opacity: 0.92;
        animation: floatup 6s linear infinite;
        will-change: transform, opacity;
      }
      .sparkle::before {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: inherit;
        left: -7px;
        top: 0;
      }
      .sparkle::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: inherit;
        left: 0;
        top: -7px;
      }

      @keyframes floatup {
        0% {
          transform: translateY(6px) scale(0.85) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        40% {
          transform: translateY(-160px) scale(1.05) rotate(15deg);
          opacity: 0.88;
        }
        100% {
          transform: translateY(-360px) scale(0.8) rotate(45deg);
          opacity: 0;
        }
      }

      .footer {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .btn {
        border: 0;
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        background: linear-gradient(90deg, #ff8abc, #ff6fa3);
        color: white;
      }
      .ghost {
        background: transparent;
        color: #ff6fa3;
        border: 1px solid rgba(255, 111, 163, 0.14);
      }

      @media (max-width: 640px) {
        .content {
          flex-direction: column;
          gap: 16px;
        }
        h1 {
          font-size: 48px;
        }
        .left {
          flex: 0 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <div
      class="card"
      role="main"
      aria-label="Sweet animated name card for Debanjana"
    >
      <div class="blob b1" aria-hidden="true"></div>
      <div class="blob b2" aria-hidden="true"></div>
      <div class="content">
        <div class="left">
          <div class="heart-wrap" aria-hidden="true">
            <div class="heart"><div class="core"></div></div>
          </div>
        </div>

        <div class="right">
          <h1 id="name">Debanjana</h1>
          <div class="subtitle">so sweet • so lovely • heart of gold ✨</div>

          <div class="wish-box">
            🌸 Wishing you endless smiles, warm hugs, and a heart that sparkles
            brighter than the stars. May every moment of your journey be filled
            with love and magic! ✨💖
          </div>

          <div class="tags" aria-hidden="false">
            <div class="tag">Dreamer</div>
            <div class="tag">Kind Soul</div>
            <div class="tag">Sparkle</div>
          </div>

          <div class="footer">
            <button class="btn" id="greetBtn">Send a sweet wish</button>
            <button class="btn ghost" id="changeColor">Change Tone</button>
          </div>
        </div>
      </div>

      <div class="sparkles" aria-hidden="true">
        <div
          class="sparkle"
          style="left: 20%; bottom: 10%; animation-delay: 0s"
        ></div>
        <div
          class="sparkle"
          style="left: 40%; bottom: 5%; animation-delay: 0.8s"
        ></div>
        <div
          class="sparkle"
          style="left: 60%; bottom: 18%; animation-delay: 1.6s"
        ></div>
        <div
          class="sparkle"
          style="left: 80%; bottom: 8%; animation-delay: 0.4s"
        ></div>
        <div
          class="sparkle"
          style="left: 28%; bottom: 24%; animation-delay: 2.1s"
        ></div>
      </div>
    </div>
    <script>
      const nameEl = document.getElementById("name");
      const greetBtn = document.getElementById("greetBtn");
      const changeBtn = document.getElementById("changeColor");

      const tones = [
        {
          accent: "#ff6fa3",
          accent2: "#ffd166",
          bg1: "#fff1f8",
          bg2: "#fff6ea",
        },
        {
          accent: "#7be0c7",
          accent2: "#9fe8e1",
          bg1: "#f7fffb",
          bg2: "#eefefa",
        },
        {
          accent: "#ffd5f0",
          accent2: "#ffc6b6",
          bg1: "#fff7f6",
          bg2: "#fffaf2",
        },
      ];
      let t = 0;

      changeBtn.addEventListener("click", () => {
        t = (t + 1) % tones.length;
        const tone = tones[t];
        document.documentElement.style.setProperty("--accent", tone.accent);
        document.documentElement.style.setProperty("--accent-2", tone.accent2);
        document.documentElement.style.setProperty("--bg1", tone.bg1);
        document.documentElement.style.setProperty("--bg2", tone.bg2);
        nameEl.animate(
          [
            { transform: "scale(1)" },
            { transform: "scale(1.04)" },
            { transform: "scale(1)" },
          ],
          { duration: 420, easing: "ease-out" }
        );
      });

      greetBtn.addEventListener("click", () => {
        const messages = [
          "You make the world brighter 💖",
          "Stay sweet, Debanjana ✨",
          "A little hug wrapped in code 🤗",
          "Keep shining, lovely! 🌟",
        ];
        const msg = messages[Math.floor(Math.random() * messages.length)];
        alert(msg);
      });

      setInterval(() => {
        nameEl.style.textShadow =
          "0 18px 44px rgba(255,111,163,0.12), 0 2px 0 rgba(255,255,255,0.6) inset";
        setTimeout(() => (nameEl.style.textShadow = ""), 1200);
      }, 4200);
    </script>
  </body>
</html>
